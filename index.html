<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PlantGuard</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/planta.css">
  <link rel="stylesheet" href="css/umbrales.css">
  <link rel="stylesheet" href="css/historial.css">
  <link rel="stylesheet" href="css/ia.css">
  <link rel="stylesheet" href="css/sim.css">
</head>

<body>
  <div class="phone">
    <div id="toasts" aria-live="polite"></div>
    <div class="screens" id="screens"></div>
    <nav id="nav" aria-label="Principal"></nav>

    <div id="plantguard-ai-container">
      <div id="ai-chat-window" class="ai-hidden">
        <div class="ai-header"><span>🌿 Asistente PlantGuard</span><button id="ai-close-btn" aria-label="Cerrar">×</button></div>
        <div class="ai-messages" id="ai-messages"></div>
        <div class="ai-input-area">
          <input id="ai-user-input" type="text" placeholder="Escribe tu pregunta…" autocomplete="off">
          <button id="ai-send-btn" aria-label="Enviar">➤</button>
        </div>
      </div>
      <button id="ai-toggle-btn" aria-label="Abrir asistente">💬</button>
    </div>
  </div>
  <!-- El orden importa: Chart.js y app.js primero; sim.js antes de las pantallas; nav.js y ai.js al final -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/sim.js" defer></script>
  <script src="js/inicio.js" defer></script>
  <script src="js/planta.js" defer></script>
  <script src="js/umbrales.js" defer></script>
  <script src="js/historial.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/ai.js" defer></script>
</body>

</html>
